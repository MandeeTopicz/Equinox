venues:
  - name: polymarket
    base_url: https://gamma-api.polymarket.com
  - name: kalshi
    base_url: https://api.elections.kalshi.com
  - name: manifold
    base_url: https://api.manifold.markets

match:
  embedding:
    provider: openai
    model: text-embedding-3-small
    api_key_env: OPENAI_API_KEY
  entity_extraction:
    provider: openai
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY

database:
  path: ./equinox.db
